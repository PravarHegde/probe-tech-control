[include probe_tech.cfg]

[mcu]
# You will need to replace this serial ID with your actual ID from 'ls /dev/serial/by-id/*'
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_57002E000451313031393839-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

########################################
# X/Y/Z Stepper Settings (Octopus Pro Drivers 0, 1, 2)
########################################

[stepper_x]
step_pin: PF13
dir_pin: !PF12  # Inverted for correct CoreXY direction
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG6 # Octopus DIAG0
position_endstop: 0
position_max: 180
homing_speed: 50
homing_retract_dist: 5

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.800
stealthchop_threshold: 999999

[stepper_y]
step_pin: PG0
dir_pin: !PG1  # Inverted for correct CoreXY direction
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG9 # Octopus DIAG1
position_endstop: 0
position_max: 180
homing_speed: 50
homing_retract_dist: 5

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.800
stealthchop_threshold: 999999

[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 200
position_min: -2
homing_speed: 10
homing_retract_dist: 15

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.650
stealthchop_threshold: 999999

########################################
# Extruder & Bed 
########################################

[extruder]
max_extrude_only_distance: 100.0
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
# ---> Fixed: Extruder now uses HE1 (PA3) and TH0 (PF4) <---
heater_pin: PA3 # HE1 on Octopus Pro
sensor_pin: PF4 # TH0 on Octopus Pro
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: -100
max_temp: 250

[tmc2209 extruder]
uart_pin: PF2
run_current: 0.800
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PA1 # HE1 / Bed on Octopus Pro
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF3 # TB on Octopus Pro
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: -100
max_temp: 130

########################################
# Probe & Servo (Mapped to BLTouch header)
########################################

[servo probe_servo]
pin: PB6 # BLTouch Servo pin on Octopus
initial_angle: 127

[probe]
pin: ^PB7 # BLTouch Sensor pin on Octopus
x_offset: -2
y_offset: 70
z_offset: 1.75
activate_gcode:
  SET_SERVO SERVO=probe_servo ANGLE=127
  G4 P500
  SET_SERVO SERVO=probe_servo WIDTH=0
deactivate_gcode:
  SET_SERVO SERVO=probe_servo ANGLE=200
  G4 P500
  SET_SERVO SERVO=probe_servo WIDTH=0

[safe_z_home]
home_xy_position: 90, 30
speed: 50
z_hop: 10
z_hop_speed: 5

[bed_mesh] 
speed: 150 
horizontal_move_z: 7 
mesh_min: 2, 70 
mesh_max: 173, 173 
probe_count: 5, 3

[fan]
pin: PA8 # Fan0 on Octopus Pro

########################################
# Display & Macros
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

[display]
# Assuming CR10 stock display or similar ST7920
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP2_3, ^EXP2_5
click_pin: ^!EXP1_2

[gcode_macro SAVE_MESH]
gcode:
  BED_MESH_PROFILE save=default

[gcode_macro START_PRINT]
gcode:
  G28
  BED_MESH_PROFILE load=default

[gcode_macro G29]
gcode:
  G28
  BED_MESH_CALIBRATE
  G1 X0 Y0 Z5 F4000

[gcode_arcs]
resolution: 1.0

[menu __main __octoprint __poweroff]
type: command
name: Turn off Octopi
gcode:
    {action_respond_info('action:poweroff')}
