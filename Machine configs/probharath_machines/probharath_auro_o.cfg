# PROBHARATH AURO O
# Budget-friendly 3D printer board
# Supports: A4988, DRV8825, or TMC drivers with UART selection
# MCU: Probharath Auro O (STM32F401 based)

[mcu]
serial: /dev/serial/by-id/usb-Probharath_Auro_O_xxxx-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000

[stepper_x]
step_pin: PA1
dir_pin: PA2
enable_pin: !PA3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA4
position_endstop: 0
position_max: 200
homing_speed: 50

# Uncomment for TMC UART:
# [tmc2209 stepper_x]
# uart_pin: PA5
# run_current: 0.800

[stepper_y]
step_pin: PB1
dir_pin: PB2
enable_pin: !PB3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB4
position_endstop: 0
position_max: 200
homing_speed: 50

# Uncomment for TMC UART:
# [tmc2209 stepper_y]
# uart_pin: PB5
# run_current: 0.800

[stepper_z]
step_pin: PC1
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 250
homing_speed: 10

[extruder]
step_pin: PD1
dir_pin: PD2
enable_pin: !PD3
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC13
sensor_pin: PA0
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PC14
sensor_pin: PA1
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130
