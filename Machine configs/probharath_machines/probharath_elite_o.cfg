# PROBHARATH ELITE O
# Premium 3D printer board with high-end features
# Supports: Built-in TMC2209s, advanced probing, multiple fans
# MCU: Probharath Elite O

[mcu]
serial: /dev/serial/by-id/usb-Probharath_Elite_O_xxxx-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 10000
max_z_velocity: 15
max_z_accel: 100

[stepper_x]
step_pin: PA1
dir_pin: PA2
enable_pin: !PA3
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_max: 300
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PA5
diag_pin: ^PA4
run_current: 1.000
driver_SGTHRS: 100

[stepper_y]
step_pin: PB1
dir_pin: PB2
enable_pin: !PB3
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_max: 300
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PB5
diag_pin: ^PB4
run_current: 1.000
driver_SGTHRS: 100

[stepper_z]
step_pin: PC1
dir_pin: PC2
enable_pin: !PC3
microsteps: 32
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 350
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: PC5
run_current: 0.800

[extruder]
step_pin: PD1
dir_pin: PD2
enable_pin: !PD3
microsteps: 32
rotation_distance: 22.23
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC13
sensor_pin: PA0
sensor_type: PT1000
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300
pressure_advance: 0.04

[tmc2209 extruder]
uart_pin: PD5
run_current: 0.650

[heater_bed]
heater_pin: PC14
sensor_pin: PA1
sensor_type: Generic 3950
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130
