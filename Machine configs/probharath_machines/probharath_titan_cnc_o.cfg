# PROBHARATH TITAN CNC O
# For Heavy CNC / Lathe machines
# Supports: External high current drivers for NEMA 34
# MCU: Probharath Titan CNC O (STM32F401 based)

[mcu]
serial: /dev/serial/by-id/usb-Probharath_Titan_CNC_O_xxxx-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 1000

# X Axis (Lathe Cross Slide / CNC X)
[stepper_x]
step_pin: PA1
dir_pin: PA2
enable_pin: !PA3
microsteps: 16
rotation_distance: 8
endstop_pin: ^PA4
position_endstop: 0
position_max: 200
homing_speed: 20

# Y Axis (CNC Y - Unused if 2-axis lathe)
[stepper_y]
step_pin: PB1
dir_pin: PB2
enable_pin: !PB3
microsteps: 16
rotation_distance: 8
endstop_pin: ^PB4
position_endstop: 0
position_max: 500
homing_speed: 20

# Z Axis (Lathe Carriage / CNC Z)
[stepper_z]
step_pin: PC1
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC4
position_endstop: 0
position_max: 500
homing_speed: 20

# Spindle Control
[output_pin spindle]
pin: PC13
pwm: True
value: 0
shutdown_value: 0

[output_pin coolant]
pin: PC14
value: 0
