        var isCloud = host.indexOf("probharath.com") !== -1 || (!isIp && window.location.protocol === "https:");

        if (isCloud) {
          // Extract claimCode from query param, parent query param, or cookie
          var urlParams = new URLSearchParams(window.location.search);

                    return new Response(JSON.stringify(data), {
                      status: 200,
                      headers: { "Content-Type": "application/json" }
                    });
                  });
                }).catch(function() {
                  var cfg = {
                    defaultLocale: "en",

                    defaultTheme: "futuristic",
                    hostname: host,
                    port: 80,
                    path: "",
                    instancesDB: "moonraker",

                ws.addEventListener("message", internalHandler);
              }
            });

            function internalHandler(event) {
              if (!_onmessage) return;
              var d = event.data;
              if (d && typeof d !== "string") {
                if (typeof d.text === "function") {

                  }).catch(function() {
