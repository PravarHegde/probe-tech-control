  <style>
    /* ProBharath Glassmorphic Top Bar - Locked Front Layer */
    header.v-app-bar.v-toolbar {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100% !important;
      height: 48px !important;
      z-index: 100 !important;
      background: rgba(12, 16, 26, 0.82) !important;
      background-color: rgba(12, 16, 26, 0.82) !important;
      backdrop-filter: blur(20px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
      border-bottom: 1px solid rgba(0, 229, 255, 0.25) !important;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.75) !important;
    }

    /* Fix panel headers: ensure flex alignment and clear separation between icon and title */
    .v-toolbar__title {
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
      overflow: visible !important;
    }
    .v-toolbar__title .v-icon {
      margin-right: 8px !important;
      flex-shrink: 0 !important;
      display: inline-flex !important;
    }
    .v-toolbar__title .subheading {
      display: inline-block !important;
      vertical-align: middle !important;
      user-select: none !important;
    }

    /* Initializing and Connection Dialog Sizing & Signature Translucent Frosted Glass */
    .v-dialog:has(.the-connection-dialog) {
      box-shadow: none !important;
      background: transparent !important;
      overflow: visible !important;
    }
    .the-connection-dialog,
    .v-dialog .the-connection-dialog,
    .v-dialog > .v-card.the-connection-dialog,
    .the-connection-dialog.v-card.theme--dark {
      min-width: 380px !important;
      max-width: 440px !important;
      border-radius: 14px !important;
      background: rgba(10, 15, 26, 0.42) !important;
      background-color: rgba(10, 15, 26, 0.42) !important;
      backdrop-filter: blur(28px) saturate(200%) !important;
      -webkit-backdrop-filter: blur(28px) saturate(200%) !important;
      border: 1px solid rgba(0, 229, 255, 0.45) !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 229, 255, 0.25) !important;
      overflow: hidden !important;
    }
    .the-connection-dialog header,
    .the-connection-dialog .v-toolbar,
    .the-connection-dialog .v-toolbar__content {
      background: rgba(0, 229, 255, 0.06) !important;
      background-color: rgba(0, 229, 255, 0.06) !important;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2) !important;
    }
    .the-connection-dialog .v-toolbar__title {
      padding: 14px 18px !important;
      gap: 12px !important;
      font-weight: 500 !important;
      color: #00f0ff !important;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4) !important;
    }
    .the-connection-dialog .v-card__text {
      padding: 22px 24px 26px !important;
      background: transparent !important;
      background-color: transparent !important;
    }
    .the-connection-dialog .v-progress-linear {
      height: 4px !important;
      min-height: 4px !important;
      max-height: 4px !important;
      border-radius: 2px !important;
      overflow: hidden !important;
    }

    /* Left Navigation Drawer: Docked directly beneath 48px top bar with zero gap */
    .v-navigation-drawer {
      top: 48px !important;
      height: calc(100vh - 48px) !important;
      max-height: calc(100vh - 48px) !important;
      z-index: 90 !important;
      background: rgba(15, 19, 29, 0.88) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border-right: 1px solid rgba(0, 229, 255, 0.15) !important;
      pointer-events: auto !important;
    }
    /* Prevent overlay scrim from dimming the dashboard */
    .v-overlay--active .v-overlay__scrim {
      opacity: 0 !important;
      display: none !important;
      pointer-events: none !important;
    }
    .v-overlay--active {
      pointer-events: none !important;
    }

    /* When navigation drawer opens, automatically dock dashboard content */
    .v-application--is-ltr .v-navigation-drawer--open:not(.v-navigation-drawer--mini-variant):not(.v-navigation-drawer--close) ~ .v-main {
      padding-left: 220px !important;
      transition: padding-left 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    .v-application--is-ltr .v-navigation-drawer--open.v-navigation-drawer--mini-variant:not(.v-navigation-drawer--close) ~ .v-main {
      padding-left: 56px !important;
      transition: padding-left 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    .v-application--is-ltr .v-navigation-drawer--close ~ .v-main {
      padding-left: 0px !important;
      transition: padding-left 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    .v-main {
      padding-top: 48px !important;
      transition: padding-left 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }


    /* Ensure ECharts chart container always has baseline dimensions without breaking progress bars */
    .echarts, [_echarts_instance_], .chart-container {
      min-width: 100% !important;
      min-height: 180px !important;
    }

    /* Ambient Elephant Watermark */
    body::after {
      content: '';
      position: fixed;
      bottom: 24px;
      right: 28px;
      width: 240px;
      height: 240px;
      background-image: url('/img/elephant-watermark-dark.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.08;
      pointer-events: none;
      z-index: 0;
      filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.12));
    }
  </style>
  <script>
    // Suppress harmless transient ECharts warning during initial DOM layout mount
    (function() {
      var origWarn = console.warn;
      console.warn = function() {
        if (arguments.length > 0 && typeof arguments[0] === 'string' && arguments[0].indexOf('Dom has no width or height') !== -1) {
          return;
        }
        return origWarn.apply(console, arguments);
      };
    })();

    // Ensure default page always lands directly on Dashboard and clear stale multi-instance cache
    (function() {
      try {
        localStorage.removeItem('instances');
        localStorage.removeItem('farm');
      } catch(e) {}
      if (!window.location.hash || window.location.hash === '' || window.location.hash === '#/dashboard') {
        window.location.hash = '#/';
      }

      // Responsive chart resize observer & Persistent navigation drawer
      window.addEventListener('load', function() {
        var drawer = document.querySelector('.v-navigation-drawer');
        if (drawer && window.ResizeObserver) {
          var ro = new ResizeObserver(function() {
            setTimeout(function() {
              window.dispatchEvent(new Event('resize'));
            }, 50);
          });
          ro.observe(drawer);
        }

        // Prevent navigation drawer from closing on outside clicks
        var disableDrawerClickOutside = function() {
          var d = document.querySelector('.v-navigation-drawer');
          if (d && d._clickOutside) {
            d._clickOutside.closeConditional = function() { return false; };
          }
        };
        disableDrawerClickOutside();
        var obs = new MutationObserver(disableDrawerClickOutside);
        obs.observe(document.body, { childList: true, subtree: true });

        // Auto-dismiss initializing dialog once live dashboard or machine view is rendered
        setInterval(function() {
          var hasLiveContent = document.querySelector('#content .v-card, .v-main .v-card, #page-container .v-card');
          var dialog = document.querySelector('.the-connection-dialog');
          if (hasLiveContent && dialog) {
            var dialogWrap = dialog.closest('.v-dialog__content');
            if (dialogWrap) {
              dialogWrap.style.setProperty('display', 'none', 'important');
              dialogWrap.style.setProperty('visibility', 'hidden', 'important');
            }
          }
        }, 200);
      });
    })();
  </script>
