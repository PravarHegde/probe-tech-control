[force_move]
enable_force_move: True

[delayed_gcode KINEMATIC_POSITION]
initial_duration: 0.2
gcode:
    SET_KINEMATIC_POSITION X=0
    SET_KINEMATIC_POSITION Y=0
    SET_KINEMATIC_POSITION Z=0

[respond]
default_type: echo

[gcode_macro G31]
description: Clear PLR recovery files
gcode:
    RUN_SHELL_COMMAND CMD=clear_plr

[gcode_shell_command clear_plr]
command: sh /home/probharath/printer_data/plr/clear_plr.sh
timeout: 5.

[gcode_macro save_last_file]
description: Record current print file for power loss recovery
gcode:
    {% set filepath = printer.virtual_sdcard.file_path %}
    {% set filename = filepath.split('/') %}
    SAVE_VARIABLE VARIABLE=last_file VALUE='"{ filename[-1] }"'
    SAVE_VARIABLE VARIABLE=filepath VALUE='"{ filepath }"'
    M118 Last File: { filename[-1] }

[gcode_macro clear_last_file]
description: Clear power loss recovery file state
gcode:
    SAVE_VARIABLE VARIABLE=last_file VALUE='""'
    SAVE_VARIABLE VARIABLE=filepath VALUE='""'
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
    SAVE_VARIABLE VARIABLE=power_resume_z VALUE=0

[gcode_shell_command POWER_LOSS_RESUME]
command: /home/probharath/printer_data/plr/plr.sh
timeout: 420.

[gcode_macro RESUME_INTERRUPTED]
description: Safely resume interrupted print after power loss
gcode:
    SET_GCODE_OFFSET Z=0 MOVE=0
    {% set z_height = params.Z_HEIGHT|default(printer.save_variables.variables.power_resume_z)|float %}
    {% set last_file = params.GCODE_FILE|default(printer.save_variables.variables.last_file)|string %}
    RESPOND MSG="⚡ Preparing Power Loss Recovery for {last_file} at Z={z_height}mm..."
    RUN_SHELL_COMMAND CMD=POWER_LOSS_RESUME PARAMS="{z_height} \"{last_file}\""
    SDCARD_PRINT_FILE FILENAME=plr/{last_file}

[gcode_macro LOG_Z]
description: Log current layer Z height (place in Slicer before layer change)
gcode:
    {% set z_pos = printer.gcode_move.gcode_position.z %}
    SAVE_VARIABLE VARIABLE=power_resume_z VALUE={z_pos}

[save_variables]
filename: /home/probharath/printer_data/config/variables.cfg

[delayed_gcode CHECK_POWER_LOSS]
initial_duration: 3.0
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if svv.was_interrupted == True and svv.power_resume_z|default(0)|float > 0 %}
      RESPOND TYPE=error MSG="⚠️ POWER LOSS DETECTED! Interrupted file: {svv.last_file} at Z={svv.power_resume_z}mm. Click RESUME_INTERRUPTED to resume printing."
      M117 PowerLoss Z={svv.power_resume_z}
    {% endif %}
