# ==============================================================================
# PROBHARATH TECHNOLOGIES - INTELLIGENT PROBING SYSTEM
# Fully compatible with custom servo-actuated microswitch probe
# ==============================================================================

[exclude_object]

[gcode_macro PROBING_MODE]
description: Check or set current probing mode (ADAPTIVE, FULL, or SAVED)
gcode:
  {% set current_mode = printer.save_variables.variables.probing_mode|default('ADAPTIVE') %}
  {% if 'MODE' in params %}
    {% set new_mode = params.MODE|upper %}
    {% if new_mode in ['ADAPTIVE', 'FULL', 'SAVED'] %}
      SAVE_VARIABLE VARIABLE=probing_mode VALUE='"{new_mode}"'
      RESPOND MSG="✅ ProBharath Probing Mode set to: {new_mode}"
    {% else %}
      RESPOND TYPE=error MSG="Invalid MODE. Choose ADAPTIVE, FULL, or SAVED."
    {% endif %}
  {% else %}
    RESPOND MSG="ℹ️ Current ProBharath Probing Mode is: {current_mode}"
  {% endif %}

[gcode_macro PROBING_ADAPTIVE]
description: 1-Click: Probe only the printed model footprint with custom servo probe
gcode:
  SAVE_VARIABLE VARIABLE=probing_mode VALUE='"ADAPTIVE"'
  RESPOND MSG="🎯 ProBharath Probing Mode set to: ADAPTIVE (KAMP)"

[gcode_macro PROBING_FULL]
description: 1-Click: Probe all 15 points across entire bed with custom servo probe
gcode:
  SAVE_VARIABLE VARIABLE=probing_mode VALUE='"FULL"'
  RESPOND MSG="📏 ProBharath Probing Mode set to: FULL (15 Points)"

[gcode_macro PROBING_SAVED]
description: 1-Click: Skip probing and use saved default bed mesh for instant start
gcode:
  SAVE_VARIABLE VARIABLE=probing_mode VALUE='"SAVED"'
  RESPOND MSG="⚡ ProBharath Probing Mode set to: SAVED (Instant Start)"
