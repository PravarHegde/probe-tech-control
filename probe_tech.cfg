[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print safely
rename_existing: CANCEL_PRINT_BASE
variable_park_x: 10.0
variable_park_y: 200.0
variable_park_z: 10.0
gcode:
  {% set x_park = printer["gcode_macro CANCEL_PRINT"].park_x|float %}
  {% set y_park = printer["gcode_macro CANCEL_PRINT"].park_y|float %}
  {% set z_safe = printer["gcode_macro CANCEL_PRINT"].park_z|float %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z + z_safe > max_z %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  TURN_OFF_HEATERS
  CLEAR_PAUSE
  SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
  clear_last_file
  G91
  {% if act_z + z_safe <= max_z and z_safe > 0 %}
    G1 Z{z_safe} F900
  {% endif %}
  G90
  G1 X{x_park} Y{y_park} F4000
  M84
  CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the actual running print safely without hitting frame limits
rename_existing: PAUSE_BASE
variable_extrude: 1.0
variable_park_x: 10.0
variable_park_y: 10.0
variable_park_z: 10.0
gcode:
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  {% set x_park = printer["gcode_macro PAUSE"].park_x|float %}
  {% set y_park = printer["gcode_macro PAUSE"].park_y|float %}
  {% set z_safe = printer["gcode_macro PAUSE"].park_z|float %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z + z_safe > max_z %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% endif %}
  {% if act_z + z_safe <= max_z and z_safe > 0 %}
    G1 Z{z_safe} F900
  {% endif %}
  G90
  G1 X{x_park} Y{y_park} F4000

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
  {% else %}
    {% set get_params = "" %}
  {% endif %}
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% endif %}
  RESUME_BASE {get_params}

[gcode_macro END_PRINT]
description: End the actual running print
gcode:
  TURN_OFF_HEATERS
  SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
  clear_last_file
  G31
  G91
  G1 Z10 F600
  G90
  G1 X0 Y200 F3000
  M84
