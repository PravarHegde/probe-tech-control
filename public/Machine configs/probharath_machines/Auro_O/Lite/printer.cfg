# ==============================================================================
# PROBHARATH TECHNOLOGIES PVT LTD
# A Probharath Technologies Product
# ==============================================================================
# PROBHARATH AURO O LITE
# Standalone Driver 3D printer board (A4988 / DRV8825)
# MCU: Probharath Auro O (STM32F401 based)
#
# Features an I2C Display and Encoder for offline control.

[mcu]
serial: /dev/serial/by-id/usb-Probharath_Auro_O_Lite_xxxx-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000

# -------------------------
# X Stepper
# -------------------------
[stepper_x]
step_pin: PB13
dir_pin: PB14
enable_pin: !PB12
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA2
position_endstop: 0
position_max: 200
homing_speed: 50

# -------------------------
# Y Stepper
# -------------------------
[stepper_y]
step_pin: PB1
dir_pin: PB0
enable_pin: !PB15  # Moved from PB10 to free I2C2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA3
position_endstop: 0
position_max: 200
homing_speed: 50

# -------------------------
# Z Stepper
# -------------------------
[stepper_z]
step_pin: PB3
dir_pin: PB4
enable_pin: !PA15
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 250
homing_speed: 10

# -------------------------
# Extruder 0
# -------------------------
[extruder]
step_pin: PA7
dir_pin: PB2
enable_pin: !PA6
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB8
sensor_pin: PA0
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

# -------------------------
# Heated Bed
# -------------------------
[heater_bed]
heater_pin: PB9
sensor_pin: PA1
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

# -------------------------
# Fans
# -------------------------
[fan]
pin: PB7
# Part Cooling Fan

[heater_fan hotend_fan]
pin: PB6
heater: extruder
heater_temp: 50.0

# -------------------------
# BLTouch / Probe
# -------------------------
[bltouch]
sensor_pin: ^PA4
control_pin: PA5
x_offset: -30
y_offset: -40
z_offset: 2.0
speed: 5.0
samples: 2

[safe_z_home]
home_xy_position: 100, 100
speed: 50
z_hop: 10
z_hop_speed: 5

# -------------------------
# Display (I2C) & Encoder
# -------------------------
[display]
lcd_type: ssd1306
i2c_bus: i2c2
i2c_scl_pin: PB10
i2c_sda_pin: PB11
encoder_pins: ^PA8, ^PA9
click_pin: ^!PB5
