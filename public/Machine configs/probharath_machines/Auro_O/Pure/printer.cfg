# ==============================================================================
# PROBHARATH TECHNOLOGIES PVT LTD
# A Probharath Technologies Product
# ==============================================================================
# PROBHARATH AURO O PURE
# Dedicated UART 3D printer board (TMC2209)
# MCU: Probharath Auro O (STM32F401 based)
#
# Features 5 Stepper drivers with 100% Dedicated UART pins for maximum bandwidth.
# Single nozzle setup.

[mcu]
serial: /dev/serial/by-id/usb-Probharath_Auro_O_Pure_xxxx-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000

# -------------------------
# X Stepper
# -------------------------
[stepper_x]
step_pin: PB13
dir_pin: PB14
enable_pin: !PB12
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA2
position_endstop: 0
position_max: 200
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PB15
run_current: 0.800

# -------------------------
# Y Stepper
# -------------------------
[stepper_y]
step_pin: PB1
dir_pin: PB0
enable_pin: !PB10
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA3
position_endstop: 0
position_max: 200
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PB11
run_current: 0.800

# -------------------------
# Z Stepper
# -------------------------
[stepper_z]
step_pin: PB3
dir_pin: PB4
enable_pin: !PA15
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 250
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: PB5
run_current: 0.800

# -------------------------
# Extruder 0
# -------------------------
[extruder]
step_pin: PA7
dir_pin: PB2
enable_pin: !PA6
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB8
sensor_pin: PA0
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

[tmc2209 extruder]
uart_pin: PA8
run_current: 0.800

# -------------------------
# Extruder 1 / Z2
# -------------------------
# [stepper_z1]
# step_pin: PC14
# dir_pin: PC15
# enable_pin: !PC13
# microsteps: 16
# rotation_distance: 8
#
# [tmc2209 stepper_z1]
# uart_pin: PA9
# run_current: 0.800

# -------------------------
# Heated Bed
# -------------------------
[heater_bed]
heater_pin: PB9
sensor_pin: PA1
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

# -------------------------
# Fans
# -------------------------
[fan]
pin: PB7
# Part Cooling Fan

[heater_fan hotend_fan]
pin: PB6
heater: extruder
heater_temp: 50.0

# -------------------------
# BLTouch / Probe
# -------------------------
[bltouch]
sensor_pin: ^PA4
control_pin: PA5
x_offset: -30
y_offset: -40
z_offset: 2.0
speed: 5.0
samples: 2

[safe_z_home]
home_xy_position: 100, 100
speed: 50
z_hop: 10
z_hop_speed: 5

# -------------------------
# NeoPixel (Optional)
# -------------------------
# [neopixel board_rgb]
# pin: PA10
# chain_count: 1
# color_order: GRB
