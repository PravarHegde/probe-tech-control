# ==============================================================================
# PROBHARATH TITAN CNC O - 2 AXIS LATHE
# Heavy-Duty Lathe Controller (STM32F401 Based)
# Supports: External NEMA 23/34 Drivers (TB6600, Closed-loop)
# ==============================================================================

[mcu]
serial: /dev/serial/by-id/usb-Probharath_Titan_CNC_O_xxxx-if00
restart_method: command

[printer]
kinematics: cartesian
# Note: Klipper supports lathe mode indirectly or via macros. 
# Typical setup maps X to cross-slide and Z to carriage.
max_velocity: 150
max_accel: 1500
max_z_velocity: 100
max_z_accel: 1000

# ==============================================================================
# X AXIS (Cross-slide)
# ==============================================================================
[stepper_x]
step_pin: PB13
dir_pin: PB14
enable_pin: !PB12
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA2
position_endstop: 0
position_max: 200
homing_speed: 20

# ==============================================================================
# Z AXIS (Carriage)
# ==============================================================================
[stepper_z]
step_pin: PB3
dir_pin: PB4
enable_pin: !PA15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA4
position_endstop: 0
position_max: 500
homing_speed: 20

# ==============================================================================
# SPINDLE (Main Chuck)
# ==============================================================================
[output_pin spindle_pwm]
# Connected to Spindle Motor Driver or Relay
pin: PB8
pwm: True
hardware_pwm: True
cycle_time: 0.001

[output_pin spindle_enable]
pin: PB9
value: 0

[gcode_macro M3]
gcode:
    SET_PIN PIN=spindle_enable VALUE=1
    {% set S = params.S|default(1000)|float %}
    SET_PIN PIN=spindle_pwm VALUE={S / 24000.0}

[gcode_macro M5]
gcode:
    SET_PIN PIN=spindle_enable VALUE=0
    SET_PIN PIN=spindle_pwm VALUE=0
