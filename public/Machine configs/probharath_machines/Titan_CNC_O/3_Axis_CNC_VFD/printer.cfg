# ==============================================================================
# PROBHARATH TITAN CNC O - 3 AXIS CNC (VFD EDITION)
# Heavy-Duty CNC Router Controller (STM32F401 Based)
# Supports: External NEMA 23/34 Drivers, VFD Spindle Control
# ==============================================================================

[mcu]
serial: /dev/serial/by-id/usb-Probharath_Titan_CNC_O_xxxx-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2000
max_z_velocity: 50
max_z_accel: 500

# ==============================================================================
# X AXIS
# ==============================================================================
[stepper_x]
step_pin: PB13
dir_pin: PB14
enable_pin: !PB12
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA2
position_endstop: 0
position_max: 1000
homing_speed: 50

# ==============================================================================
# Y AXIS
# ==============================================================================
[stepper_y]
step_pin: PB1
dir_pin: PB0
enable_pin: !PB10
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA3
position_endstop: 0
position_max: 1000
homing_speed: 50

# ==============================================================================
# Z AXIS
# ==============================================================================
[stepper_z]
step_pin: PB3
dir_pin: PB4
enable_pin: !PA15
microsteps: 16
rotation_distance: 8
endstop_pin: ^PA4
position_endstop: 100
position_max: 100
position_min: -10
homing_speed: 20

# ==============================================================================
# HIGH-FREQUENCY VFD SPINDLE CONTROL
# ==============================================================================
# Configured for a standard 0-10V analog input VFD using a PWM-to-Analog converter
[output_pin vfd_pwm]
pin: PB8
pwm: True
hardware_pwm: True
cycle_time: 0.001
value: 0

[output_pin vfd_enable]
pin: PB9
value: 0

[gcode_macro M3]
description: Start Spindle Clockwise
gcode:
    SET_PIN PIN=vfd_enable VALUE=1
    {% set S = params.S|default(1000)|float %}
    # Assuming max RPM is 24000
    SET_PIN PIN=vfd_pwm VALUE={S / 24000.0}

[gcode_macro M5]
description: Stop Spindle
gcode:
    SET_PIN PIN=vfd_enable VALUE=0
    SET_PIN PIN=vfd_pwm VALUE=0

# ==============================================================================
# COOLANT PUMP / MIST
# ==============================================================================
[output_pin coolant_pump]
pin: PB7
value: 0

[gcode_macro M8]
description: Coolant ON
gcode:
    SET_PIN PIN=coolant_pump VALUE=1

[gcode_macro M9]
description: Coolant OFF
gcode:
    SET_PIN PIN=coolant_pump VALUE=0
