# ==============================================================================
# PROBHARATH TECHNOLOGIES PVT LTD
# A Probharath Technologies Product
# ==============================================================================
# PROBHARATH MACHINE 2: 3D Printer (CoreXY)
# MCU: STM32F401
# Drivers: 5 total (Mix of A4988, DRV8825, TMC2208, TMC2209)
# Motors: NEMA 17 (4.2kg, 5.6kg, 7kg torque)

[mcu]
# Update with your STM32F401 serial ID
serial: /dev/serial/by-id/usb-Klipper_stm32f401xc_xxxx-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

########################################
# X Axis (CoreXY)
# Motor: NEMA 17
########################################
[stepper_x]
step_pin: PA1
dir_pin: !PA2 # Invert if moving wrong direction
enable_pin: !PA3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA4
position_endstop: 0
position_max: 200
homing_speed: 50

# Uncomment and configure if using TMC2208/2209 in UART mode
# [tmc2209 stepper_x]
# uart_pin: PA5
# run_current: 0.800

########################################
# Y Axis (CoreXY)
# Motor: NEMA 17
########################################
[stepper_y]
step_pin: PB1
dir_pin: !PB2 # Invert if moving wrong direction
enable_pin: !PB3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB4
position_endstop: 0
position_max: 200
homing_speed: 50

# Uncomment and configure if using TMC2208/2209 in UART mode
# [tmc2209 stepper_y]
# uart_pin: PB5
# run_current: 0.800

########################################
# Z Axis
# Motor: NEMA 17
########################################
[stepper_z]
step_pin: PC1
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC4 # Or probe:z_virtual_endstop
position_max: 250
position_min: -2
homing_speed: 10

########################################
# Extruder
# Motor: NEMA 17
########################################
[extruder]
step_pin: PD1
dir_pin: PD2
enable_pin: !PD3
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

########################################
# Heated Bed
########################################
[heater_bed]
heater_pin: PC14
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130
