# ==============================================================================
# PROBHARATH TECHNOLOGIES PVT LTD
# A Probharath Technologies Product
# ==============================================================================
# PROBHARATH MACHINE 1: 2-Axis CNC Lathe
# MCU: STM32F401
# Motors: Big NEMA 34
# Note: NEMA 34 motors usually require external high-current drivers (like TB6600, DM542, etc.)

[mcu]
# Update with your STM32F401 serial ID
serial: /dev/serial/by-id/usb-Klipper_stm32f401xc_xxxx-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 1000
max_z_velocity: 10
max_z_accel: 100

########################################
# X Axis (Lathe Cross Slide)
########################################
[stepper_x]
# Replace pins with your STM32F401 board wiring
step_pin: PA1
dir_pin: PA2
enable_pin: !PA3
microsteps: 16
rotation_distance: 8 # Adjust based on your leadscrew pitch
endstop_pin: ^PA4
position_endstop: 0
position_max: 200
homing_speed: 20

########################################
# Z Axis (Lathe Carriage)
########################################
[stepper_z]
# Replace pins with your STM32F401 board wiring
step_pin: PB1
dir_pin: PB2
enable_pin: !PB3
microsteps: 16
rotation_distance: 8 # Adjust based on your leadscrew pitch
endstop_pin: ^PB4
position_endstop: 0
position_max: 500
homing_speed: 20

# Optional: Spindle Control (PWM)
[output_pin spindle]
pin: PC13
pwm: True
value: 0
shutdown_value: 0
