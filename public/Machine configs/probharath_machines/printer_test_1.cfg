# printer_test_1.cfg
# Basic configuration to test the STM32F401 and A4988 driver on the X-axis

[mcu]
# You will need to update this serial port once connected to the Pi. 
# Run `ls /dev/serial/by-id/*` on the Raspberry Pi via SSH to find the exact ID.
serial: /dev/serial/by-id/usb-Klipper_stm32f401_... 
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PB13
dir_pin: PB14
# Note: The enable pin is inverted (!) because A4988 modules use active-low enable logic.
enable_pin: !PB12
microsteps: 16
rotation_distance: 40
# We define a dummy endstop pin (PA1) just to satisfy Klipper's requirements for a valid config
endstop_pin: ^!PA1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PB1
dir_pin: PB0
enable_pin: !PB10
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PA2
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PB3
dir_pin: PB4
enable_pin: !PA15
microsteps: 16
rotation_distance: 8
endstop_pin: ^!PA3
position_endstop: 0
position_max: 200
homing_speed: 5

# A simple macro you can run from PTC to test if the motor steps forward and back
[gcode_macro TEST_X_MOTOR]
gcode:
    # Set relative positioning
    G91
    # Move X motor 10mm at 500mm/min
    G1 X10 F500
    # Wait half a second
    G4 P500
    # Move back 10mm
    G1 X-10 F500
    # Return to absolute positioning
    G90
