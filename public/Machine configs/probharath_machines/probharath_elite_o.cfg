# ==============================================================================
# PROBHARATH TECHNOLOGIES PVT LTD
# A Probharath Technologies Product
# ==============================================================================
# PROBHARATH ELITE O
# Premium 3D printer board with high-end features
# MCU: Probharath Elite O (STM32G0B1 64-Pin based)
#
# Features:
# - Dual Extrusion (IDEX capable)
# - 5x TMC2209 Drivers with 100% Dedicated UART & Sensorless Homing
# - High performance compute for CoreXY scaling

[mcu]
serial: /dev/serial/by-id/usb-Probharath_Elite_O_xxxx-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 10000
max_z_velocity: 15
max_z_accel: 100

# -------------------------
# X Stepper
# -------------------------
[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_max: 300
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
diag_pin: ^PC0
run_current: 1.000
driver_SGTHRS: 100

# -------------------------
# Y Stepper
# -------------------------
[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_max: 300
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC10
diag_pin: ^PC1
run_current: 1.000
driver_SGTHRS: 100

# -------------------------
# Z Stepper
# -------------------------
[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 32
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 350
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: PC9
run_current: 0.800

# -------------------------
# Extruder 0
# -------------------------
[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
microsteps: 32
rotation_distance: 22.23
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA9
sensor_pin: PA0
sensor_type: PT1000
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300
pressure_advance: 0.04

[tmc2209 extruder]
uart_pin: PC8
run_current: 0.650

# -------------------------
# Extruder 1 (Dual Nozzle)
# -------------------------
[extruder1]
step_pin: PD2
dir_pin: PD3
enable_pin: !PD4
microsteps: 32
rotation_distance: 22.23
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA10
sensor_pin: PA1
sensor_type: PT1000
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300

[tmc2209 extruder1]
uart_pin: PC7
run_current: 0.650

# -------------------------
# Heated Bed
# -------------------------
[heater_bed]
heater_pin: PA8
sensor_pin: PA2
sensor_type: Generic 3950
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

# -------------------------
# Fans & Extras
# -------------------------
[fan]
pin: PB15

[heater_fan hotend_fan_0]
pin: PB14
heater: extruder
heater_temp: 50.0

[heater_fan hotend_fan_1]
pin: PB13
heater: extruder1
heater_temp: 50.0

# -------------------------
# BLTouch / Probe
# -------------------------
[bltouch]
sensor_pin: ^PA4
control_pin: PA5
x_offset: -30
y_offset: -40
z_offset: 2.0
speed: 5.0
samples: 2

[safe_z_home]
home_xy_position: 150, 150
speed: 100
z_hop: 10
z_hop_speed: 10

# -------------------------
# Displays & Neopixel
# -------------------------
[neopixel rgb]
pin: PD0
chain_count: 8
color_order: GRB
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 0.0
