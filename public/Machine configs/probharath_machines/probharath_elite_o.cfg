# ==============================================================================
# PROBHARATH ELITE O
# Premium 3D printer board (STM32F401 based)
# Supports: Shared UART TMC2209s, and hardware jumper selections for
# Dual Extrusion, NeoPixel, I2C, WiFi, and Sensorless Homing.
# ==============================================================================

[mcu]
serial: /dev/serial/by-id/usb-Probharath_Elite_O_xxxx-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

# ==============================================================================
# X AXIS 
# (Set to Sensorless Homing by default via Jumper Block B)
# ==============================================================================
[stepper_x]
step_pin: PB13
dir_pin: !PB14
enable_pin: !PB12
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop # Uses PA2 if jumper set to physical
position_endstop: 0
position_max: 235
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PA9
uart_address: 0
diag_pin: ^PA2
run_current: 0.800
stealthchop_threshold: 999999
driver_SGTHRS: 75

# ==============================================================================
# Y AXIS 
# (Set to Sensorless Homing by default via Jumper Block B)
# ==============================================================================
[stepper_y]
step_pin: PB1
dir_pin: !PB0
enable_pin: !PB10
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop # Uses PA3 if jumper set to physical
position_endstop: 0
position_max: 235
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PA9
uart_address: 1
diag_pin: ^PA3
run_current: 0.800
stealthchop_threshold: 999999
driver_SGTHRS: 75

# ==============================================================================
# Z AXIS
# ==============================================================================
[stepper_z]
step_pin: PB3
dir_pin: PB4
enable_pin: !PA15
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop # Uses PA10 if jumper set to physical Z endstop
position_max: 250
position_min: -2

[tmc2209 stepper_z]
uart_pin: PA9
uart_address: 2
run_current: 0.800
stealthchop_threshold: 999999

# ==============================================================================
# EXTRUDER 0
# ==============================================================================
[extruder]
step_pin: PA7
dir_pin: PB2
enable_pin: !PA6
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 260

[tmc2209 extruder]
uart_pin: PB15
run_current: 0.600
stealthchop_threshold: 999999

# ==============================================================================
# JUMPER BLOCK A: 5TH STEPPER (E1) vs EXPANSION
# ==============================================================================
# Uncomment the block below if the hardware jumper is set to Dual Extrusion
# [extruder1]
# step_pin: PC14
# dir_pin: PC15
# enable_pin: !PC13
# microsteps: 16
# rotation_distance: 33.500

# Uncomment the block below if the hardware jumper is set to Expansion (NeoPixel/I2C)
# [neopixel rgb_strip]
# pin: PC14
# chain_count: 10
# color_order: GRB
# initial_RED: 1.0

# ==============================================================================
# JUMPER BLOCK C: DUAL HOTENDS vs WIFI UART
# ==============================================================================
# The Heater 1 and Thermistor 1 pins share routing with the ESP32 WiFi UART. 
# Do not uncomment below if the board jumper is set to WiFi!

# [extruder1]
# heater_pin: PA8
# sensor_pin: PB5

# ==============================================================================
# HEATED BED
# ==============================================================================
[heater_bed]
heater_pin: PB9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

# ==============================================================================
# FANS
# ==============================================================================
[fan]
# Part Cooling Fan
pin: PB7

[heater_fan hotend_fan]
# Hotend 0 Cooling Fan
pin: PB6
heater: extruder
heater_temp: 50.0

# ==============================================================================
# PROBE (BLTOUCH)
# ==============================================================================
[bltouch]
sensor_pin: ^PA4
control_pin: PA5
x_offset: -30
y_offset: -40
z_offset: 2.0
speed: 5.0
samples: 2

[safe_z_home]
home_xy_position: 117.5, 117.5
speed: 50
z_hop: 10
z_hop_speed: 5
